# nginx proxy address - http://172.17.0.1:64132

name: canvas-lms
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: instructure/canvas-lms:stable
    container_name: canvas-lms-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CANVAS_DATABASE_HOST: canvas-lms-db
      CANVAS_DATABASE_PORT: 5432
      CANVAS_DATABASE_NAME: ${DB_CREATE_DATABASE_NAME:-canvas}
      CANVAS_DATABASE_USER: ${DB_USER_NAME:-canvas}
      CANVAS_DATABASE_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CANVAS_SECRET_KEY_BASE: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      CANVAS_ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      CANVAS_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      CANVAS_SMTP_ADDRESS: ${EMAIL_SERVER_HOST:-172.17.0.1}
      CANVAS_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      CANVAS_SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      CANVAS_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      CONTAINER_NAME: canvas-lms-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64132:80'
    volumes:
      - './volumes/data/canvas-lms:/data'
      - './volumes/config/canvas-lms:/config'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      canvas-lms-db:
        condition: service_healthy
    networks:
      - canvas-lms

  canvas-lms-db:
    image: postgres:latest
    container_name: canvas-lms-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: canvas-lms-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-canvas}
      POSTGRES_USER: ${DB_USER_NAME:-canvas}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: canvas-lms-db
    volumes:
      - './volumes/data/db/postgres/canvas-lms:/var/lib/postgresql/data:z'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - canvas-lms

networks:
  canvas-lms:
    name: canvas-lms
    external: false
